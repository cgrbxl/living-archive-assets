<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="36" fill="#F8FAFC"/><text x="72" y="86" font-family="IBM Plex Serif,Georgia,serif" font-size="34" font-weight="600" fill="#163B66">Allocation map</text><text x="72" y="122" font-family="IBM Plex Sans,Arial,sans-serif" font-size="18" fill="#234B76">A calm view of how recorded holdings form the whole</text><g transform="translate(360 380)" fill="none" stroke-linecap="round"><circle r="174" stroke="#E5E7EB" stroke-width="48"/><path d="M0-174A174 174 0 0 1 165 55" stroke="#163B66" stroke-width="48"/><path d="M165 55A174 174 0 0 1-95 146" stroke="#234B76" stroke-width="48"/><path d="M-95 146A174 174 0 0 1-158-73" stroke="#D9E1EA" stroke-width="48"/><path d="M-158-73A174 174 0 0 1 0-174" stroke="#E67E22" stroke-width="48"/><circle r="96" stroke="#CDD6DF" stroke-width="3"/><circle r="8" fill="#E67E22" stroke="none"/></g><g font-family="IBM Plex Sans,Arial,sans-serif"><g transform="translate(665 230)"><circle r="9" fill="#163B66"/><text x="26" y="7" font-size="24" fill="#163B66">Core holdings</text><text x="26" y="37" font-size="17" fill="#234B76">recorded structure</text></g><g transform="translate(665 330)"><circle r="9" fill="#234B76"/><text x="26" y="7" font-size="24" fill="#163B66">Diversifiers</text><text x="26" y="37" font-size="17" fill="#234B76">distinct sources of exposure</text></g><g transform="translate(665 430)"><circle r="9" fill="#D9E1EA"/><text x="26" y="7" font-size="24" fill="#163B66">Cash reserve</text><text x="26" y="37" font-size="17" fill="#234B76">liquidity and planned use</text></g><g transform="translate(665 530)"><circle r="9" fill="#E67E22"/><text x="26" y="7" font-size="24" fill="#163B66">Under review</text><text x="26" y="37" font-size="17" fill="#234B76">attention, not recommendation</text></g></g><path d="M72 650h1056" stroke="#D9E1EA" stroke-width="3"/><circle cx="72" cy="650" r="7" fill="#E67E22"/></svg>
