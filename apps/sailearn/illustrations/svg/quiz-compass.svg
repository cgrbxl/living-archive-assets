<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="36" fill="#F8FAFC"/><text x="72" y="86" font-family="IBM Plex Serif,Georgia,serif" font-size="34" font-weight="600" fill="#163B66">Quiz compass</text><text x="72" y="122" font-family="IBM Plex Sans,Arial,sans-serif" font-size="18" fill="#234B76">Questions orient the next review; they do not rank the learner</text><g transform="translate(420 395)" fill="none" stroke="#163B66" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle r="190"/><circle r="112" stroke="#D9E1EA" stroke-width="3"/><path d="m52-112-27 137-116 76 27-137z"/><path d="M0-190v35M190 0h-35M0 190v-35M-190 0h35"/></g><circle cx="445" cy="420" r="10" fill="#E67E22"/><g font-family="IBM Plex Sans,Arial,sans-serif"><g transform="translate(735 260)"><circle r="9" fill="#163B66"/><text x="28" y="7" font-size="24" fill="#163B66">Question</text><text x="28" y="38" font-size="17" fill="#234B76">read the evidence</text></g><g transform="translate(735 375)"><circle r="9" fill="#E67E22"/><text x="28" y="7" font-size="24" fill="#163B66">Response</text><text x="28" y="38" font-size="17" fill="#234B76">record the current understanding</text></g><g transform="translate(735 490)"><circle r="9" fill="#D9E1EA"/><text x="28" y="7" font-size="24" fill="#163B66">Review</text><text x="28" y="38" font-size="17" fill="#234B76">chart the next useful step</text></g></g></svg>