<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="36" fill="#F8FAFC"/><text x="72" y="86" font-family="IBM Plex Serif,Georgia,serif" font-size="34" font-weight="600" fill="#163B66">Turn cycle</text><text x="72" y="122" font-family="IBM Plex Sans,Arial,sans-serif" font-size="18" fill="#234B76">The start-of-turn flow keeps choices visible and reversible where the rules allow</text><g transform="translate(600 395)" fill="none" stroke="#163B66" stroke-width="8" stroke-linecap="round"><path d="M0-210a210 210 0 0 1 210 210M210 0A210 210 0 0 1 0 210M0 210A210 210 0 0 1-210 0M-210 0A210 210 0 0 1 0-210"/><path d="M192-22 210 0l22-18M22 192 0 210l18 22M-192 22-210 0l-22 18M-22-192 0-210l-18-22"/></g><g font-family="IBM Plex Sans,Arial,sans-serif" text-anchor="middle"><g transform="translate(600 185)"><circle r="56" fill="#F8FAFC" stroke="#D9E1EA" stroke-width="3"/><text y="-3" font-size="19" fill="#163B66">reinforce</text><text y="21" font-size="14" fill="#234B76">place arrivals</text></g><g transform="translate(810 395)"><circle r="56" fill="#F8FAFC" stroke="#D9E1EA" stroke-width="3"/><text y="-3" font-size="19" fill="#163B66">support</text><text y="21" font-size="14" fill="#234B76">air choice</text></g><g transform="translate(600 605)"><circle r="56" fill="#F8FAFC" stroke="#D9E1EA" stroke-width="3"/><text y="-3" font-size="19" fill="#163B66">act</text><text y="21" font-size="14" fill="#234B76">move and fire</text></g><g transform="translate(390 395)"><circle r="56" fill="#F8FAFC" stroke="#D9E1EA" stroke-width="3"/><text y="-3" font-size="19" fill="#163B66">review</text><text y="21" font-size="14" fill="#234B76">end turn</text></g></g><circle cx="810" cy="395" r="9" fill="#E67E22"/></svg>